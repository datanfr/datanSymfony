name: Déploiement

# Déploiement par « git pull » sur le serveur, comme PoliticAnalysis qui vit sur
# la même machine : l'hébergement est mutualisé, sans systemd ni droit de
# recharger PHP-FPM, et une copie par rsync n'y apporterait rien.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Deux déploiements simultanés se marcheraient dessus dans le même répertoire.
concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    name: Mettre en ligne
    runs-on: ubuntu-latest

    steps:
      - name: Clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Déployer
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e
          cd ${{ vars.DEPLOY_PATH || '/home/wqktajhw/datan' }}

          # Vider var/cache/prod sous une commande en cours la fait échouer sans
          # message exploitable (CLAUDE.md) : le sync de 6 h et le déploiement ne
          # doivent jamais se croiser. Mieux vaut refuser que casser la moisson.
          if ps -u "$(id -un)" -o args= 2>/dev/null | grep -q '[a]pp:sync:quotidien'; then
            echo "!! Synchronisation quotidienne en cours. Déploiement interrompu."
            exit 1
          fi

          echo "→ Code"
          git pull origin master

          echo "→ Dépendances"
          php ~/composer.phar install --no-interaction --prefer-dist --no-dev --optimize-autoloader

          echo "→ Migrations"
          php bin/console doctrine:migrations:migrate --no-interaction --no-ansi --allow-no-migration

          # assets/vendor/ est dans .gitignore : Stimulus et Turbo, déclarés
          # distants dans importmap.php, ne sont pas dans le dépôt et doivent se
          # télécharger ici, avant la compilation.
          echo "→ Paquets JavaScript"
          php bin/console importmap:install --no-ansi

          echo "→ Compilation des assets"
          php bin/console asset-map:compile --no-ansi

          # En dernier : le conteneur compilé fige le nombre d'arguments de chaque
          # constructeur. Servir du code neuf avec un cache ancien fait tomber les
          # pages en ArgumentCountError (CLAUDE.md).
          echo "→ Cache"
          php bin/console cache:clear --env=prod --no-ansi

          echo "✓ En ligne"
          EOF

      - name: Vérifier que le site répond
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.URL_PUBLIQUE }}")
          echo "HTTP $code sur ${{ vars.URL_PUBLIQUE }}"
          test "$code" = "200"
